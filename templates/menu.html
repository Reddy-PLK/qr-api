<!DOCTYPE html>
<html>
<head>
    <title>My Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding: 20px;
        }
        .menu {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
        }
        .item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="menu">
    <h1>🍽️ My Menu</h1>

    <div class="item">
        <span>Pizza</span>
        <span>₹250</span>
    </div>

    <div class="item">
        <span>Burger</span>
        <span>₹150</span>
    </div>

    <div class="item">
        <span>Pasta</span>
        <span>₹200</span>
    </div>

    <div class="item">
        <span>Coffee</span>
        <span>₹80</span>
    </div>

</div>

</body>
</html>
